name: whale scout (diagnostic)

# Диагностика: есть ли спортивные киты, проходящие пороги. Без алертов/ставок.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run whale scout
        run: python3 whale_scout.py
