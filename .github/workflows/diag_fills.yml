name: Diag Fills (one-off)

# Manual only — run from the Actions tab. Diagnostic for the fill-matcher;
# safe to delete once we've read the output.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Probe Data API for our trades
        run: |
          echo "Diag — $(date -u +'%Y-%m-%d %H:%M UTC')"
          python diag_fills.py
