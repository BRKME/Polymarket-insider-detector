name: leaderboard scout (diagnostic)

# Диагностика: спортивные киты через официальный лидерборд Polymarket.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run leaderboard scout
        run: python3 leaderboard_scout.py
