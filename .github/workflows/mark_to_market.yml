name: Mark-to-Market (open positions)

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2h — manual exits need timely re-marking
  workflow_dispatch:

permissions:
  contents: write           # exit_seen.json (дедуп сигналов) должен переживать прогон

jobs:
  remark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Re-mark open positions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Mark-to-market — $(date -u +'%Y-%m-%d %H:%M UTC')"
          python mark_to_market.py

      - name: Persist dedup state
        run: |
          git config user.name "MtM Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exit_seen.json 2>/dev/null || true
          if git commit -m "chore(mtm): dedup state [skip ci]"; then
            for i in 1 2 3; do
              git push && break
              echo "retry $i"; sleep 5; git pull --rebase origin main || true
            done
          else
            echo "No dedup changes"
          fi
