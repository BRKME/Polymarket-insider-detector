name: v5 Weekly Status

# Воскресный статус живой v5-стратегии (вместо ежедневной эпитафии легаси):
# позиции/филлы, экспозиция, накопление калибровки, дни до чекпойнтов.
on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Send weekly status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python v5_weekly_status.py
