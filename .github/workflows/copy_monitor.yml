name: copy monitor (sports whales)

# Копи-монитор: свежие спортивные входы доверенных китов из живого списка.
# Часто, т.к. свежесть входа критична (цена убегает).
on:
  schedule:
    - cron: '0 */3 * * *'      # каждые 3 часа
  workflow_dispatch: {}

permissions:
  contents: write              # для копи-seen (дедуп)

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run copy monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 copy_monitor.py
      - name: Commit seen state
        run: |
          git config user.name "Aleksander Brk"
          git config user.email "106615154+BRKME@users.noreply.github.com"
          if [ -n "$(git status --porcelain copy_seen.json)" ]; then
            git add copy_seen.json
            git commit -m "copy monitor: update seen state [skip ci]"
            # Race-safe: голый push при коллизии с соседним воркфлоу терял
            # seen-state -> дубли алертов на следующем прогоне
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push attempt $i failed, retrying..."; sleep 5
            done
          else
            echo "no new copy signals"
          fi
